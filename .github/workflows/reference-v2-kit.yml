name: V2 makeup-reference production kit

on:
  pull_request:
    paths:
      - "scripts/quality/prepare_reference_v2.py"
      - "scripts/quality/make_catalog_review_sheets.py"
      - "scripts/quality/test_reference_v2.py"
      - "scripts/quality/audit_pixel_locked_look.py"
      - "scripts/quality/test_pixel_locked_look.py"
      - "scripts/quality/compose_source_locked.py"
      - "scripts/quality/test_source_locked_compositor.py"
      - "scripts/quality/render_material_look.py"
      - "scripts/quality/test_material_look.py"
      - "scripts/quality/author_four_pilot_masks.py"
      - "scripts/quality/test_author_four_pilot_masks.py"
      - "scripts/quality/audit_landmark_masks.py"
      - "scripts/quality/test_landmark_masks.py"
      - "scripts/quality/detect_source_face.py"
      - "scripts/quality/author_mesh_pilot_masks.py"
      - "scripts/quality/test_source_mesh_pipeline.py"
      - "scripts/quality/render_rhinestones.py"
      - "scripts/quality/test_rhinestones.py"
      - "scripts/quality/material_recipes/rhinestone-accessories-STUDY.json"
      - "src/data/makeup-styles.ts"
      - ".github/workflows/reference-v2-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image verification dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Generate 43 individual production briefs
        run: python scripts/quality/prepare_reference_v2.py generate --out catalog-v2-production-pack
      - name: Verify manifest, source and 4-pilot specifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('catalog-v2-production-pack')
          data = json.loads((p/'manifest.json').read_text(encoding='utf8'))
          assert len(data['styles']) == 42
          assert data['style_count'] == 42
          assert data['reference_image_count'] == 43
          assert set(data['pilots']) == {'no-makeup','hollywood','electric-blue','rhinestone'}
          assert len(list((p/'prompts').glob('*.txt'))) == 43
          assert not data['release_approved']
          assert data['cosmetic_free_master']['ground_truth_required']
          print('43 briefs produced: neutral master + 42 distinct style recipes.')
          PY
      - name: Verify missing authentic bare master blocks any candidate acceptance
        run: |
          if python scripts/quality/prepare_reference_v2.py validate \
             --candidate-dir /tmp/nonexistent-hbeauty-v2 \
             --phase pilot --out /tmp/v2-negative-test; then
            echo "::error::V2 candidate gate incorrectly accepted absent bare source" && exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/v2-negative-test/validation.json').read_text())
          assert not report['passed_structural_check']
          assert not report['approved_for_production']
          assert 'MISSING MASTER' in ' '.join(report['errors'])
          print('Missing genuine bare face is correctly rejected.')
          PY
      - name: Run V2 reference source-provenance and asset safety tests
        run: python scripts/quality/test_reference_v2.py
      - name: Enforce makeup-only pixel protection and mask safety
        run: python scripts/quality/test_pixel_locked_look.py
      - name: Verify source-locked cosmetic compositing and reject seams
        run: python scripts/quality/test_source_locked_compositor.py
      - name: Verify source-locked cosmetic material rendering and original texture preservation
        run: python scripts/quality/test_material_look.py
      - name: Verify manual four-look mask geometry and exact source identity gates
        run: python scripts/quality/test_author_four_pilot_masks.py
      - name: Reject lip, eye and liner masks that violate source-specific face geometry
        run: python scripts/quality/test_landmark_masks.py
      - name: Verify research rhinestone facets, micro-shadows, and exact pixel locking
        run: python scripts/quality/test_rhinestones.py
      - name: Verify offline source-face mesh provenance and four anatomy-derived pilot masks
        run: python scripts/quality/test_source_mesh_pipeline.py
      - name: Generate seven existing-catalog visual comparison sheets
        run: python scripts/quality/make_catalog_review_sheets.py --out catalog-review-sheets
      - name: Publish existing-catalog visual comparison sheets
        uses: actions/upload-artifact@v4
        with:
          name: hbeauty-42-look-review-sheets
          path: catalog-review-sheets
          retention-days: 30
      - name: Publish 43-image production brief pack
        uses: actions/upload-artifact@v4
        with:
          name: hbeauty-v2-43-reference-briefs
          path: catalog-v2-production-pack
          retention-days: 30
