name: Test independently hosted makeup studio
on:
  push:
    paths:
      - 'staging-photo-test/**'
      - '.github/staging/test-photo-studio.mjs'
      - '.github/workflows/photo-test-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root Playwright tooling
        run: npm ci --no-audit --no-fund
      - name: Build independently hosted preview
        run: |
          npm install --prefix staging-photo-test --no-audit --no-fund
          npm run build --prefix staging-photo-test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start localhost preview
        shell: bash
        run: |
          (cd staging-photo-test && npm run preview -- --host 127.0.0.1 --port 4174 --strictPort >/tmp/makeup-preview.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/makeup-preview.log
          exit 1
      - name: Paint, validate and download original-size PNG on mobile and desktop
        run: node .github/staging/test-photo-studio.mjs
      - name: Scope note
        if: always()
        run: |
          echo 'This tests the local-only manual test studio. It is not the V14 trained neural model.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production H-Beauty is not modified by this workflow.' >> "$GITHUB_STEP_SUMMARY"
