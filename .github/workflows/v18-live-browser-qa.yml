name: Verify deployed V18 Cloudflare PWA in real browser
on:
  push:
    paths:
      - '.github/workflows/v18-live-browser-qa.yml'
      - '.github/staging/v18-live-browser-qa.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Confirm offline shell on public staging Worker
        run: node .github/staging/v18-live-browser-qa.mjs
      - name: Summary
        if: always()
        run: echo 'Read-only live browser check of h-beauty-makeup. Neural image inference not certified; original production h-beauty untouched.' >> "$GITHUB_STEP_SUMMARY"
