name: Prepare verified V14 upload intake
on:
  push:
    paths:
      - .github/workflows/prepare-v14-intake.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Open draft release for verified full V14 archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jjh167910-cloud/H-beauty-makeup"
          TAG="v14-makeup-staging-import"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; no changes made."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --draft \
              --title "V14 Makeup Staging — upload exact FULL ZIP" \
              --notes "Upload only H-Beauty-MaxQuality-Implementation-v14-FULL.zip (SHA256 8da7a75b370bfc7b1862ec139ca54ad8f0196a1935f76f5f5385a55116825fb4), then publish this release. The importer verifies the SHA and copies source to this staging repo, never the H-Beauty production repo or Worker. Neural research remains non-production."
          fi
          echo "## V14 release intake" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft: https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
