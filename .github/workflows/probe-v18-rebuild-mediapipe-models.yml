name: Recover pinned offline face landmarks and segmentation
on:
  push:
    paths:
      - '.github/workflows/probe-v18-rebuild-mediapipe-models.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact Google Face Landmarker task file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified-models/tryon
          curl --fail --location --retry 2 --max-time 160 -o /tmp/verified-models/tryon/face_landmarker.task \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
          echo '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  /tmp/verified-models/tryon/face_landmarker.task' | sha256sum -c -
      - name: Retrieve unmodified upstream segmentation model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 -o /tmp/source-segment.tflite \
            'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite'
          ls -lh /tmp/source-segment.tflite
      - name: Install reproducible FlatBuffer/TFLite converter
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 flatbuffers==25.9.23 ai-edge-litert
      - name: Convert to the exact H-Beauty V18 8.3MB float16 segmentation file
        shell: bash
        run: |
          python - <<'PY'
          import sys,numpy as np,flatbuffers,hashlib,pathlib
          from ai_edge_litert import schema_py_generated as S
          data=pathlib.Path('/tmp/source-segment.tflite').read_bytes()
          m=S.ModelT.InitFromObj(S.Model.GetRootAsModel(data,0))
          g=m.subgraphs[0]
          deq=next((i for i,c in enumerate(m.operatorCodes) if max(c.builtinCode,c.deprecatedBuiltinCode)==S.BuiltinOperator.DEQUANTIZE),None)
          if deq is None:
            c=S.OperatorCodeT()
            c.builtinCode=S.BuiltinOperator.DEQUANTIZE
            c.deprecatedBuiltinCode=S.BuiltinOperator.DEQUANTIZE
            c.version=2
            m.operatorCodes.append(c)
            deq=len(m.operatorCodes)-1
          new_ops=[]
          for ti,t in enumerate(list(g.tensors)):
            b=m.buffers[t.buffer]
            if t.type!=S.TensorType.FLOAT32 or b.data is None or len(b.data)<4096: continue
            w=np.frombuffer(bytes(b.data),np.float32)
            h=S.TensorT()
            h.shape=list(t.shape)
            h.type=S.TensorType.FLOAT16
            h.name=(t.name or b'')+b'_fp16'
            nb=S.BufferT()
            nb.data=np.frombuffer(w.astype(np.float16).tobytes(),np.uint8)
            m.buffers.append(nb)
            h.buffer=len(m.buffers)-1
            g.tensors.append(h)
            b.data=None
            op=S.OperatorT()
            op.opcodeIndex=deq
            op.inputs=[len(g.tensors)-1]
            op.outputs=[ti]
            new_ops.append(op)
          g.operators=new_ops+g.operators
          fb=flatbuffers.Builder(1<<20)
          fb.Finish(m.Pack(fb),file_identifier=b'TFL3')
          out=fb.Output()
          digest=hashlib.sha256(out).hexdigest()
          print('Converted segmentation bytes:',len(out),'SHA-256:',digest)
          assert len(out)==8290292 and digest=='d2cd8f253fb44f135900753d0124c5228285165cf2a8f8100fbe958ad7bc55df', 'Upstream segmentation variant/serialisation differs; do not substitute'
          pathlib.Path('/tmp/verified-models/tryon/segment.tflite').write_bytes(out)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hbeauty-v18-reproducible-landmarker-segmentation
          path: /tmp/verified-models/
          retention-days: 30
      - name: Summary
        if: always()
        run: echo 'Face-landmark and segmentation origin check; no claim of full V18 deployment.' >> "$GITHUB_STEP_SUMMARY"
