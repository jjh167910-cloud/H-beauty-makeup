name: Verify V18 browser neural runtimes reproducible from npm
on:
  push:
    paths:
      - '.github/workflows/probe-v18-rebuild-wasm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned ONNX Runtime and MediaPipe package files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hbeauty-v18-npm
          cd /tmp/hbeauty-v18-npm
          npm install --ignore-scripts --no-audit --no-fund --no-save onnxruntime-web@1.30.0 @mediapipe/tasks-vision@1.1.1
      - name: Check five exact runtime files against V18 SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hbeauty-v18-npm/node_modules
          cat > /tmp/hbeauty-v18-npm/hashes <<'EOF'
          3d1c85995364bb643302fc6fd877a0c3ba5ae72401815e0f24828a53d9191e28  onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.mjs
          39f9f0894d478800487ed9f7dbe92618498db320cf55c8e3d89adff8dce658da  onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.wasm
          e13f7f94fc51b4ca72b12faeb1ee95f4ace6dfbc8939bc718aabdc0a27c4299b  onnxruntime-web/dist/ort-wasm-simd-threaded.mjs
          3398c10d07d229bd91b364548e130e0e51a8e5704b88c7c083ebbeb78842dee2  onnxruntime-web/dist/ort-wasm-simd-threaded.wasm
          6522286aa32dd93eff17c3da002b0649516f87abfec7a80b5bfe5c9625caa5f8  @mediapipe/tasks-vision/wasm/vision_wasm_internal.js
          0e101a010e262ef8e78f22e3c95b60a9705fd06962753c9acd6356d9fb56b7bd  @mediapipe/tasks-vision/wasm/vision_wasm_internal.wasm
          EOF
          sha256sum --check /tmp/hbeauty-v18-npm/hashes
          mkdir -p /tmp/verified-runtime/tryon/ort /tmp/verified-runtime/tryon/wasm
          cp onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.mjs onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.wasm \
             onnxruntime-web/dist/ort-wasm-simd-threaded.mjs onnxruntime-web/dist/ort-wasm-simd-threaded.wasm \
             /tmp/verified-runtime/tryon/ort/
          cp @mediapipe/tasks-vision/wasm/vision_wasm_internal.{js,wasm} /tmp/verified-runtime/tryon/wasm/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hbeauty-v18-reproducible-browser-runtime
          path: /tmp/verified-runtime/
          retention-days: 30
      - name: Report
        if: always()
        run: |
          echo 'Pinned npm runtime reconstruction; only verified bytes may enter the V18 staging build.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No external inference; no production Worker changes.' >> "$GITHUB_STEP_SUMMARY"
