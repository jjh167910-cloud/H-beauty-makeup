name: Verify live hosted neural image inference (synthetic only)
on:
  push:
    paths:
      - '.github/workflows/neural-live-check.yml'
      - '.github/staging/neural-live-check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test_neural_endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "pillow>=10,<13"
      - name: One neural model request using synthetic faces only
        run: python .github/staging/neural-live-check.py
      - name: Research-only disclosure
        if: always()
        run: |
          echo 'This tests actual cloud neural image generation from schematic inputs, not photographic realism, identity preservation, offline operation, or the unimported V14 model.' >> "$GITHUB_STEP_SUMMARY"
