name: Private-opacity research CPU smoke

on:
  pull_request:
    paths:
      - "scripts/quality/prepare_paired_dataset.py"
      - "scripts/quality/train_opacity_carrier.py"
      - "scripts/quality/test_paired_dataset.py"
      - "scripts/quality/test_train_opacity_carrier.py"
      - "docs/OPACITY_CARRIER_TRAINING.md"
      - ".github/workflows/opacity-research-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-research-smoke:
    name: Synthetic subject-disjoint opacity model training (NO private data)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic fixture requirements
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Install CPU-only PyTorch
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check provenance, unchanged-photo and subject leakage constraints
        run: python scripts/quality/test_paired_dataset.py
      - name: Verify real forward/backward pass and held-out synthetic evaluation
        run: python scripts/quality/test_train_opacity_carrier.py
      # Deliberately NEVER publish weights, masks, dataset paths, face images,
      # private consents, training indexes or pseudo-identities as artifacts.
