name: Rebuild and verify offline GFPGAN model from pinned open weights
on:
  push:
    paths:
      - '.github/workflows/probe-v18-rebuild-gfpgan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic model conversion tools
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 onnx==1.19.0
      - name: Download pinned Apache-2.0 GFPGAN release weights
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 540 \
            --output /tmp/gfpgan_1.4.onnx \
            https://huggingface.co/facefusion/models-3.0.0/resolve/728b9659bd9691bf32cbf7f61af478d94b7ba81e/gfpgan_1.4.onnx
          echo 'accc4757b26bdb89b32b4d3500d4f79c9dff97c1dd7c7104bf9dcb95e3311385  /tmp/gfpgan_1.4.onnx' | sha256sum -c -
      - name: Recreate V18 model shards and check exact SHA-256
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import onnx
          import numpy as np
          from onnx import numpy_helper,helper
          from pathlib import Path
          expected=[
            ('gfpgan-1.4-q8.0.bin',48000000,'f2a0ecfb6b8c87e63ed45fa74802ed5588fcab4b3a47f1bba174287f6df079b9'),
            ('gfpgan-1.4-q8.1.bin',37577374,'96fd074aa10814f557e51fee070924d433f5b08035d87f6438d5f3709cc13092')
          ]
          m=onnx.load('/tmp/gfpgan_1.4.onnx')
          g=m.graph
          inits,nodes=[],[]
          for t in list(g.initializer):
            a=numpy_helper.to_array(t)
            if a.dtype != np.float32 or a.size < 4096:
              inits.append(t)
              continue
            axis=1 if (a.ndim==5 and a.shape[0]==1) else 0
            amax=np.abs(a).max(axis=tuple(i for i in range(a.ndim) if i!=axis))
            scale=np.where(amax>0,amax/127,1).astype(np.float32)
            shape=[1]*a.ndim
            shape[axis]=-1
            q=np.clip(np.round(a/scale.reshape(shape)),-127,127).astype(np.int8)
            inits += [numpy_helper.from_array(q,t.name+'_q8'),
                      numpy_helper.from_array(scale,t.name+'_s'),
                      numpy_helper.from_array(np.zeros_like(scale,np.int8),t.name+'_z')]
            nodes.append(helper.make_node('DequantizeLinear',[t.name+'_q8',t.name+'_s',t.name+'_z'],[t.name],axis=axis))
          del g.initializer[:]
          g.initializer.extend(inits)
          old_nodes=list(g.node)
          del g.node[:]
          g.node.extend(nodes+old_nodes)
          data=m.SerializeToString()
          assert len(data)==sum(v[1] for v in expected),('Source converter output size changed',len(data))
          for i,(name,bytes_expected,hash_expected) in enumerate(expected):
            chunk=data[i*48000000:(i+1)*48000000]
            digest=hashlib.sha256(chunk).hexdigest()
            print(name,'size',len(chunk),'sha256',digest,flush=True)
            assert len(chunk)==bytes_expected and digest==hash_expected, 'V18 model hash not reproducible: '+name
            Path('/tmp/'+name).write_bytes(chunk)
          print('PASS: both H-Beauty V18 GFPGAN model assets reconstructed EXACTLY from pinned upstream')
          PY
      - name: Keep verified exact model shards for subsequent deployment work
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hbeauty-v18-reproducible-gfpgan-weights
          path: |
            /tmp/gfpgan-1.4-q8.0.bin
            /tmp/gfpgan-1.4-q8.1.bin
          retention-days: 30
      - name: Explain scope
        if: always()
        run: |
          {
            echo '## V18 binary provenance probe'
            echo 'Pinned upstream: facefusion/models-3.0.0 GFPGAN (Apache-2.0)'
            echo 'This check tests only two large model shards, NOT the complete V18 offline pack.'
            echo 'Failed digest means do not substitute these reconstructed weights into verified V18.'
            echo 'Production and staging Workers were unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
