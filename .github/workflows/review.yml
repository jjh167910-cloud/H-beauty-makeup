name: Try-on review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent dozens of simultaneous 15+ minute browser suites as the pilot
# branch is incrementally repaired. Only the latest commit needs full review.
concurrency:
  group: tryon-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify offline app shell
        run: node --test tests-node/*.test.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Vite
        run: npm run build
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Verify new eye-material pixel and geometry regressions
        run: npm run test:ui -- tests/material-eye-v2.spec.ts tests/material-eye-gpu.spec.ts tests/material-eye-canvas.spec.ts tests/material-eye-native.spec.ts tests/material-eye-finish.spec.ts tests/material-eye-native-fast.spec.ts tests/material-eye-timing.spec.ts tests/material-eye-geometry.spec.ts tests/material-eye-benchmark.spec.ts
      - name: Verify native material eye on full saved-photo renderer
        run: npm run test:ui -- tests/material-eye-native-integration.spec.ts
      - name: Verify streamed download cancellation and retry
        run: npm run test:ui -- tests/tryon-download.spec.ts
      - name: Verify responsive live-camera capture after studio edits
        run: npm run test:ui -- tests/tryon.spec.ts --grep "live mirror paints the look on the camera picture"
      - name: Upload targeted test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryon-targeted-results
          path: |
            test-results/
          retention-days: 7

  # The complete UI suite contains 23 heavyweight photo-model tests in a
  # single spec file. By default Playwright shards by file, not test, so
  # --fully-parallel is needed to spread that spec across three runners.
  # Every test still executes exactly once; no regression is skipped.
  # One worker per runner avoids parallel software WebGL/ONNX pressure.
  full-browser:
    name: Full Playwright suite (shard ${{ matrix.shard }}/3)
    needs: review
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Full UI regression tests (all specs, disjoint shards)
        run: npm run test:ui -- --fully-parallel --workers=1 --shard=${{ matrix.shard }}/3
      - name: Upload shard test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryon-full-shard-${{ matrix.shard }}
          path: |
            test-results/
          retention-days: 7
