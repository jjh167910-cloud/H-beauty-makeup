name: Try-on review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify offline app shell
        run: node --test tests-node/*.test.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Vite
        run: npm run build
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Verify streamed download cancellation and retry
        run: npm run test:ui -- tests/tryon-download.spec.ts
      - name: Try-on tests
        run: npm run test:ui
      - name: Upload test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryon-test-results
          path: |
            test-results/
          retention-days: 7
