name: Publish verified V18 offline PWA to isolated Cloudflare Worker
on:
  push:
    paths:
      - '.github/workflows/deploy-v18-verified-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbeauty-v18-staging-publish
  cancel-in-progress: false
jobs:
  verify_and_publish:
    if: ${{ github.repository == 'jjh167910-cloud/H-beauty-makeup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download complete verified PWA build, not the old baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hbeauty-v18-stage
          gh release download v18-reconstructed-pwa-build --repo "$GITHUB_REPOSITORY" \
            --pattern 'HBeauty-V18-COMPLETE-VERIFIED-PWA.zip' \
            --pattern 'HBeauty-V18-COMPLETE-VERIFIED-PWA.sha256' \
            --dir /tmp/hbeauty-v18-stage
          cd /tmp/hbeauty-v18-stage
          sha256sum -c HBeauty-V18-COMPLETE-VERIFIED-PWA.sha256
          unzip -q HBeauty-V18-COMPLETE-VERIFIED-PWA.zip -d site
      - name: Confirm complete PWA and shippable static model chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/hbeauty-v18-stage/site')
          audit=json.loads((root/'_GITHUB_SOURCE_AUDIT.json').read_text())
          assert audit['files']==1179 and audit['bytes']==222537413
          assert audit['sources']=={'overlay':382,'recovered':9,'baseline':788}
          assert audit['source_sha256']=='c94b46dfb30e6bbcafa611d24399aada9f38a3f5a04ce220a1e75c146f3fec86'
          dist=root/'dist'
          for name in ('index.html','sw.js','manifest.webmanifest','_hbeauty_model_parts_v18/manifest.json'):
            assert (dist/name).is_file(),name
          m=json.loads((dist/'_hbeauty_model_parts_v18/manifest.json').read_text())
          assert m['schema']==18
          assert len(m['files'])==3
          count=0
          for original,entry in m['files'].items():
            digest=hashlib.sha256()
            for part in entry['parts']:
              local=dist/part['path'].lstrip('/')
              assert local.is_file() and local.stat().st_size==part['bytes']
              data=local.read_bytes()
              assert hashlib.sha256(data).hexdigest()==part['sha256']
              digest.update(data);count+=1
            assert digest.hexdigest()==entry['sha256'],original
          assert count==8
          big=[str(p) for p in dist.rglob('*') if p.is_file() and p.stat().st_size>24*1024*1024]
          assert not big, 'Cloudflare oversized assets: '+str(big)
          print('PASS: verified V18 browser app, 3 losslessly split models / 8 parts; Cloudflare-size compliant')
          PY
      - name: Check authorization (never publish to production Worker)
        id: authorization
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Complete verified V18 site is ready, but this repository has no staging Cloudflare account authorization. No deployment attempted."
          fi
      - name: Generate isolated Cloudflare Worker config
        if: steps.authorization.outputs.publish == 'true'
        shell: bash
        run: |
          cat > /tmp/hbeauty-v18-stage/site/wrangler.jsonc <<'EOF'
          {
            "name": "h-beauty-makeup",
            "compatibility_date": "2026-11-09",
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          EOF
      - name: Publish complete V18 PWA ONLY to h-beauty-makeup staging
        if: steps.authorization.outputs.publish == 'true'
        working-directory: /tmp/hbeauty-v18-stage/site
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Summary
        if: always()
        run: |
          {
            echo '## H-Beauty V18 staging'
            echo 'Verified compiled PWA downloaded from published GitHub Release; no original ZIP upload required.'
            echo 'The only possible Worker name is h-beauty-makeup.'
            echo 'No production H-Beauty modification.'
            echo 'Real-device offline inference and photorealism are not independently certified by these checks.'
          } >> "$GITHUB_STEP_SUMMARY"
