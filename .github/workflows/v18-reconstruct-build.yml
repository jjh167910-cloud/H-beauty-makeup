name: Reconstruct and build complete verified V18 offline PWA
on:
  push:
    paths:
      - '.github/workflows/v18-reconstruct-build.yml'
      - '.github/v18-transfer/parts/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hbeauty-v18-verified-source
  cancel-in-progress: true
jobs:
  complete_offline_pwa:
    if: ${{ github.repository == 'jjh167910-cloud/H-beauty-makeup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V18_DIR: /tmp/hbeauty-v18-complete/H-beauty
    steps:
      - name: Checkout isolated makeup repository and verified transfer parts
        uses: actions/checkout@v4
      - name: Retrieve previously SHA-verified neural model subset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hbeauty-v18-transfer/recovered
          gh run download 42661023998 --repo "$GITHUB_REPOSITORY" \
            -n hbeauty-v18-recovered-offline-models-VERIFIED \
            -D /tmp/hbeauty-v18-transfer/recovered
          test -s /tmp/hbeauty-v18-transfer/recovered/RECOVERY_MANIFEST.json
          cd /tmp/hbeauty-v18-transfer/recovered
          zip -q -r /tmp/hbeauty-v18-transfer/HBeauty-V18-VERIFIED-MODEL-SUBSET.zip RECOVERY_MANIFEST.json public/
      - name: Reconstruct source and verify every original V18 Git blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,stat,zipfile
          repo=pathlib.Path.cwd()
          out=pathlib.Path('/tmp/hbeauty-v18-complete/H-beauty')
          out.mkdir(parents=True,exist_ok=True)
          parts=sorted((repo/'.github/v18-transfer/parts').glob('v18-overlay-*.part'))
          assert len(parts)==12, f'Expected 12 transfer parts, got {len(parts)}'
          data=b''.join(p.read_bytes() for p in parts)
          assert len(data)==25148777, 'Transfer archive size mismatch'
          expected_overlay='2b466a4f986000df92149c022800c80f4342bdc7e1d333919d1911d9dde0de4a'
          assert hashlib.sha256(data).hexdigest()==expected_overlay, 'Transferred V18 overlay SHA-256 mismatch'
          recovery=pathlib.Path('/tmp/hbeauty-v18-transfer/HBeauty-V18-VERIFIED-MODEL-SUBSET.zip')
          source_sha='c94b46dfb30e6bbcafa611d24399aada9f38a3f5a04ce220a1e75c146f3fec86'
          def safe_zip(z):
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(item.external_attr>>16), 'Unsafe source path'
              assert z.testzip() is None, 'Corrupted ZIP entry'
          def object_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          with zipfile.ZipFile(io.BytesIO(data)) as overlay,zipfile.ZipFile(recovery) as recovered:
              safe_zip(overlay);safe_zip(recovered)
              manifest=json.loads(overlay.read('_V18_COMPLETE_GIT_MANIFEST.json'))
              provenance=json.loads(overlay.read('_V18_TRANSFER_PROVENANCE.json'))
              assert manifest['source_sha256']==source_sha==provenance['source_sha256']
              expected=manifest['files']
              assert len(expected)==1179 and len({x['path'] for x in expected})==1179
              recovered_manifest=json.loads(recovered.read('RECOVERY_MANIFEST.json'))
              assert len(recovered_manifest['files'])==9
              recovered_paths={'public/'+p.removeprefix('/') for p in recovered_manifest['files']}
              assert len(recovered_paths)==9
              overlay_paths={x for x in overlay.namelist() if not x.startswith('_V18_') and not x.endswith('/')}
              assert len(overlay_paths)==382
              assert overlay_paths.isdisjoint(recovered_paths)
              counts={'overlay':0,'recovered':0,'baseline':0}
              total=0
              for f in expected:
                  name=f['path'];path=pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if name in overlay_paths:
                      blob=overlay.read(name);kind='overlay'
                  elif name in recovered_paths:
                      blob=recovered.read(name);kind='recovered'
                      check=recovered_manifest['files']['/'+name.removeprefix('public/')]
                      assert hashlib.sha256(blob).hexdigest()==check['sha256'], 'Recovered model SHA-256 changed: '+name
                  else:
                      local=repo/name
                      assert local.is_file() and not local.is_symlink(), 'Baseline file absent: '+name
                      blob=local.read_bytes();kind='baseline'
                  assert len(blob)==f['size'], 'Original V18 file size mismatch: '+name
                  assert object_sha(blob)==f['sha'], 'Original V18 Git SHA-1 mismatch: '+name
                  dest=out/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(blob)
                  counts[kind]+=1;total+=len(blob)
              assert counts=={'overlay':382,'recovered':9,'baseline':788},counts
              assert total==222537413,total
              assert (out/'QUALITY_V18_MANIFEST.json').is_file()
              config=(out/'wrangler.jsonc').read_text()
              assert '"name": "h-beauty-makeup"' in config
              print('PASS exact 1,179 original V18 files reconstructed, bytes=',total,'sources=',counts)
              (out/'_GITHUB_SOURCE_AUDIT.json').write_text(json.dumps({'source_sha256':source_sha,'files':len(expected),'bytes':total,'sources':counts},indent=2))
          PY
      - name: Apply recorded web-build TypeScript annotation after original source verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('/tmp/hbeauty-v18-complete/H-beauty')
          p=root/'src/lib/photo-export.ts'
          source=p.read_text(encoding='utf-8')
          before='pending.set(nonce, (success) => {'
          after='pending.set(nonce, (success: boolean) => {'
          assert source.count(before)==1, 'Source changed; refusing unreviewed code patch'
          original_hash=hashlib.sha256(p.read_bytes()).hexdigest()
          p.write_text(source.replace(before,after),encoding='utf-8')
          audit=root/'_GITHUB_SOURCE_AUDIT.json'
          report=json.loads(audit.read_text(encoding='utf-8'))
          report['post_validation_build_patch']={
            'file':'src/lib/photo-export.ts',
            'reason':'TS7006 implicit any in Android compatibility callback, web behavior unchanged',
            'original_sha256':original_hash,
            'patched_sha256':hashlib.sha256(p.read_bytes()).hexdigest()
          }
          audit.write_text(json.dumps(report,indent=2))
          print('Recorded and applied single explicit TS annotation after exact V18 source validation')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install complete V18 dependencies
        working-directory: /tmp/hbeauty-v18-complete/H-beauty
        run: npm ci --no-audit --no-fund
      - name: Run offline, image catalog, TypeScript, and PWA source checks
        working-directory: /tmp/hbeauty-v18-complete/H-beauty
        run: |
          npm run test:offline
          npm run verify:pwa
          npm run verify:assets
          npm run typecheck
      - name: Build complete V18 PWA and verify cached offline model delivery
        working-directory: /tmp/hbeauty-v18-complete/H-beauty
        run: |
          npm run build
          npm run verify:pwa-dist
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HBeauty-V18-COMPLETE-VERIFIED-PWA
          path: |
            /tmp/hbeauty-v18-complete/H-beauty/dist/
            /tmp/hbeauty-v18-complete/H-beauty/_GITHUB_SOURCE_AUDIT.json
          retention-days: 21
      - name: Release status
        if: always()
        run: |
          {
            echo '## Complete V18 source build'
            echo 'Source: 1,179 original Git SHA-1 verified files; no unpinned assets.'
            echo 'Build is offline-capable only after one-time device model installation.'
            echo 'No cloud inference, no manual masks, no production site changes.'
            echo 'Photorealism and physical-device airplane-mode rendering are not certified by this CI.'
          } >> "$GITHUB_STEP_SUMMARY"
