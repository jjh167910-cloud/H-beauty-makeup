name: H-Beauty legacy baseline CI (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify public baseline only
        run: |
          npm ci --no-audit --no-fund
          npm run verify:assets
          npm run test:offline
          npm run typecheck
          npm run build
      - name: Explain release separation
        if: always()
        run: |
          echo 'Legacy baseline CI does not deploy anything.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use v18-full-release.yml for the SHA-pinned offline PWA release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production H-Beauty and the h-beauty-makeup staging Worker remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
