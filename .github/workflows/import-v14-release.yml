name: Import verified V14 archive into isolated makeup staging
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: import-hbeauty-v14
  cancel-in-progress: false
jobs:
  import_v14:
    if: ${{ github.repository == 'jjh167910-cloud/H-beauty-makeup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Download only the release's V14 archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jjh167910-cloud/H-beauty-makeup"
          mkdir -p /tmp/hbeauty-v14-inbox
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'H-Beauty-MaxQuality-Implementation-v14-FULL.zip' \
            --dir /tmp/hbeauty-v14-inbox
          test -s /tmp/hbeauty-v14-inbox/H-Beauty-MaxQuality-Implementation-v14-FULL.zip
      - name: Validate exact known archive checksum and safe contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, stat
          p=pathlib.Path("/tmp/hbeauty-v14-inbox/H-Beauty-MaxQuality-Implementation-v14-FULL.zip")
          digest=hashlib.file_digest(p.open("rb"),"sha256").hexdigest()
          expected="8da7a75b370bfc7b1862ec139ca54ad8f0196a1935f76f5f5385a55116825fb4"
          assert digest==expected, f"V14 archive SHA256 does not match pinned value: {digest}"
          with zipfile.ZipFile(p) as z:
            members=z.infolist()
            assert len(members)>1100, "Expected complete V14 source and assets"
            assert sum(i.file_size for i in members)<300_000_000, "Unexpected uncompressed payload size"
            for i in members:
              name=pathlib.PurePosixPath(i.filename)
              assert not name.is_absolute() and name.parts[:1]==("H-beauty",), f"Unexpected path: {i.filename}"
              assert ".." not in name.parts, f"Traversal path: {i.filename}"
              assert not stat.S_ISLNK(i.external_attr>>16), f"Symlink forbidden: {i.filename}"
            assert "H-beauty/QUALITY_V14_MANIFEST.json" in z.namelist()
            assert "H-beauty/scripts/quality/compare_renderer_v14.py" in z.namelist()
            z.extractall("/tmp/hbeauty-v14-source")
          print("Verified complete SHA-pinned V14 archive, safe to import.")
          PY
      - name: Import V14 source without production deployment workflows
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' --exclude='/.github/' \
            --exclude='/node_modules/' --exclude='/dist/' --exclude='/.wrangler/' \
            /tmp/hbeauty-v14-source/H-beauty/ ./
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path("wrangler.jsonc")
          t=p.read_text(encoding="utf-8")
          assert '"name": "h-beauty"' in t, "Unexpected Wrangler Worker name"
          p.write_text(t.replace('"name": "h-beauty"','"name": "h-beauty-makeup"'),encoding="utf-8")
          j=json.loads(pathlib.Path("QUALITY_V14_MANIFEST.json").read_text(encoding="utf-8"))
          assert j["production_ready"] is False
          assert j["allowed_in_live_app"] is False
          assert j["customer_rendering_engine_changed"] is False
          pathlib.Path("V14_STAGING_PROVENANCE.md").write_text(
            "# Verified V14 staging source\n\n"
            "Imported from SHA256-pinned H-Beauty-MaxQuality-Implementation-v14-FULL.zip.\n"
            "The research model is NOT production approved.\n"
            "Staging Worker only: h-beauty-makeup.\n"
            "The H-Beauty production repository and Worker are untouched.\n",
            encoding="utf-8")
          print("V14 manifest verified; production deployment disabled.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "research: import verified V14 package into isolated makeup staging"
            git push origin HEAD:main
          fi
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## V14 source import"
            echo "Archive: SHA256-pinned release asset."
            echo "Destination: jjh167910-cloud/H-beauty-makeup (staging only)."
            echo "Next step: automated staging build in the existing staging workflow."
            echo "Production H-Beauty remains untouched."
          } >> "$GITHUB_STEP_SUMMARY"
