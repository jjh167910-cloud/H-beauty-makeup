name: Public glitter calibration
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/glitter-calibration.spec.ts'
      - 'scripts/bench/score_glitter_calibration.py'
      - 'src/lib/makeup-gl.ts'
      - '.github/workflows/glitter-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgles2 libegl1
      - run: python -m pip install 'mediapipe>=0.10.20,<0.11' opencv-python-headless numpy scikit-image
      - run: npm ci
      - name: Render public GPU pairs
        env:
          HB_GLITTER_CALIBRATION_DIR: ${{ runner.temp }}/glitter-calibration
        run: npx playwright test tests/glitter-calibration.spec.ts --workers=1
      - name: Compare sparkle metrics and safety controls
        run: python scripts/bench/score_glitter_calibration.py "$RUNNER_TEMP/glitter-calibration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-glitter-calibration
          path: ${{ runner.temp }}/glitter-calibration
          if-no-files-found: warn
          retention-days: 7
