name: H-Beauty V18 FULL — verified offline web release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h-beauty-makeup-v18-pwa
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.repository == 'jjh167910-cloud/H-beauty-makeup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout staging workflow only
        uses: actions/checkout@v4
      - name: Download the exact V18 FULL package from same private repository release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v18-offline-web'
          mkdir -p /tmp/hbeauty-v18-package
          if ! gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'H-Beauty-Offline-Web-PWA-v18-FULL.zip' \
            --dir /tmp/hbeauty-v18-package; then
            echo '::error::Verified V18 FULL ZIP is absent from the private staging release. No build or deployment was attempted.'
            exit 1
          fi
      - name: Verify exact ZIP SHA and extract safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,zipfile,stat
          file=pathlib.Path('/tmp/hbeauty-v18-package/H-Beauty-Offline-Web-PWA-v18-FULL.zip')
          expected='c94b46dfb30e6bbcafa611d24399aada9f38a3f5a04ce220a1e75c146f3fec86'
          with file.open('rb') as handle:
              assert hashlib.file_digest(handle,'sha256').hexdigest()==expected, 'V18 ZIP SHA256 mismatch'
          with zipfile.ZipFile(file) as z:
              entries=z.infolist()
              assert len(entries)>=1179, 'Incomplete V18 archive'
              assert sum(e.file_size for e in entries)<270_000_000, 'Uncompressed payload unexpectedly large'
              for item in entries:
                  p=pathlib.PurePosixPath(item.filename)
                  assert p.parts[0]=='H-beauty' and '..' not in p.parts and not p.is_absolute(), 'Unsafe ZIP path'
                  assert not stat.S_ISLNK(item.external_attr>>16), 'Symlink forbidden'
              needed=['H-beauty/QUALITY_V18_MANIFEST.json','H-beauty/package-lock.json',
                'H-beauty/scripts/verify-pwa-dist-v18.mjs','H-beauty/public/offline-pack-v15.json']
              assert all(p in z.namelist() for p in needed), 'Missing V18 release components'
              assert z.testzip() is None, 'Corrupted ZIP entry'
              z.extractall('/tmp/hbeauty-v18-source')
          print('PASS: exact V18 release SHA256 and 1179+ safe archive members')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install full web dependencies
        working-directory: /tmp/hbeauty-v18-source/H-beauty
        run: npm ci --no-audit --no-fund
      - name: Run complete browser-source and asset integrity gates
        working-directory: /tmp/hbeauty-v18-source/H-beauty
        run: |
          npm run test:offline
          npm run verify:assets
          npm run typecheck
      - name: Build self-contained offline PWA and split oversized models
        working-directory: /tmp/hbeauty-v18-source/H-beauty
        run: |
          npm run build
          npm run verify:pwa-dist
      - uses: actions/upload-artifact@v4
        with:
          name: h-beauty-makeup-V18-verified-PWA-dist
          path: /tmp/hbeauty-v18-source/H-beauty/dist/
          retention-days: 14
      - name: Staging-only Cloudflare authorization
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='/tmp/hbeauty-v18-source/H-beauty/wrangler.jsonc'
          config=json.load(open(p))
          assert config['name']=='h-beauty-makeup', 'Only the dedicated staging Worker is allowed'
          print('Verified Cloudflare worker name: h-beauty-makeup')
          PY
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Verified build artifact available; Cloudflare not connected to this staging repository.'
          fi
      - name: Publish isolated offline V18 PWA
        if: steps.stage.outputs.ready == 'true'
        working-directory: /tmp/hbeauty-v18-source/H-beauty
        run: npx --yes wrangler@4 deploy
      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## H-Beauty V18 verified web PWA'
            echo 'Source: SHA256-pinned original FULL ZIP, not the public baseline.'
            echo 'Cloudflare target: h-beauty-makeup ONLY; no production mutation.'
            echo 'When the offline model pack is successfully installed, inference is device-side.'
            echo 'Physical-device airplane-mode and real-photo quality claims require separate validation.'
          } >> "$GITHUB_STEP_SUMMARY"
