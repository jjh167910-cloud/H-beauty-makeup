name: Public soft-liner calibration
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/soft-liner-calibration.spec.ts'
      - 'scripts/bench/score_soft_liner_calibration.py'
      - '.github/workflows/soft-liner-calibration.yml'
      - 'src/data/look-recipes.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgles2 libegl1
      - run: python -m pip install 'mediapipe>=0.10.20,<0.11' opencv-python-headless numpy scikit-image
      - run: npm ci
      - name: Render ten public-only paired eyeliner candidates
        env:
          HB_SOFT_LINER_DIR: ${{ runner.temp }}/soft-liner-calibration
        run: npm run test:ui -- tests/soft-liner-calibration.spec.ts --workers=1 --reporter=line
      - run: python scripts/bench/score_soft_liner_calibration.py "$RUNNER_TEMP/soft-liner-calibration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-soft-liner-calibration
          path: ${{ runner.temp }}/soft-liner-calibration
          retention-days: 7
