name: Probe reusable H-Beauty offline model assets
on:
  push:
    paths:
      - '.github/workflows/probe-v18-asset-origin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only public asset provenance check
        shell: bash
        run: |
          set -uo pipefail
          for origin in "https://h-beauty.mostifa2273.workers.dev" \
                        "https://h-beauty-try-on-v19-1-independent-preview-l4gpe4.v2.appdeploy.ai"; do
          echo "ASSET_ORIGIN: $origin"
          for path in \
            /offline-pack-v15.json \
            /tryon/looks.json \
            /tryon/tiny/soft-glam.onnx \
            /tryon/face_landmarker.task \
            /tryon/ort/ort-wasm-simd-threaded.wasm; do
            name="$(basename "$path")"
            printf 'CHECK %s\n' "$path"
            code="$(curl -sSL --retry 1 --connect-timeout 12 --max-time 45 -w '%{http_code}' -o /tmp/asset-probe -H 'Accept: application/octet-stream' "$origin$path" || true)"
            size="$(wc -c < /tmp/asset-probe 2>/dev/null || printf 0)"
            digest="$(sha256sum /tmp/asset-probe 2>/dev/null | cut -c1-24)"
            printf 'RESULT status=%s bytes=%s sha256_prefix=%s\n' "$code" "$size" "$digest"
            if [ "$path" = "/offline-pack-v15.json" ] && [ "$code" = "200" ]; then
              python3 - <<'PY'
          import json
          p='/tmp/asset-probe'
          try:
              data=json.load(open(p))
              assets=data.get('assets',[])
              print('MANIFEST valid=',isinstance(assets,list),'assets=',len(assets))
          except (ValueError, OSError):
              print('MANIFEST not_json')
          PY
            fi
          done
          done
          echo 'Read-only diagnostic. No production data or configuration changed.' >> "$GITHUB_STEP_SUMMARY"
