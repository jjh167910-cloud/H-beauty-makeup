name: Catalog pale-lid photometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/pale-lids.spec.ts'
      - 'scripts/bench/diagnose_pale_lids.py'
      - 'scripts/bench/audit_eye_cap.py'
      - 'scripts/tinybeauty/teacher.py'
      - 'src/lib/makeup-gl.ts'
      - 'public/tryon/layers/**'
      - '.github/workflows/pale-lid-photometry.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new experimental change supersedes obsolete 48-look re-renders on the
# same PR. Preserve a complete run for the current head only.
concurrency:
  group: catalog-eye-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  photometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact app dependencies
        run: npm ci --no-audit --no-fund
      - name: Measure the three public catalog eyelids in WebGL
        run: npm run test:ui -- tests/pale-lids.spec.ts --workers=1 --reporter=line

  source-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MediaPipe's Linux GPU loader libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgles2 libegl1
      - name: Install catalog diagnostic dependencies (public assets only)
        run: python -m pip install --disable-pip-version-check 'mediapipe>=0.10.20,<0.11' opencv-python-headless numpy
      - name: Identify lightness lost while extracting public source makeup layers
        run: python scripts/bench/diagnose_pale_lids.py --sweep

  full-public-eye-cap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MediaPipe runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgles2 libegl1
      - name: Install public-catalog analysis dependencies
        run: python -m pip install --disable-pip-version-check 'mediapipe>=0.10.20,<0.11' opencv-python-headless numpy
      - name: Audit all public catalog looks for eye-only brightness and other-face spill
        run: |
          python -m py_compile scripts/bench/audit_eye_cap.py
          python scripts/bench/audit_eye_cap.py --all --cap 0.8
