name: Assemble verified V18 offline neural asset recovery
on:
  push:
    paths:
      - '.github/workflows/assemble-v18-recovered-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download previously verified recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery/gfpgan /tmp/recovery/runtime /tmp/recovery/face /tmp/v18-recovered/public/tryon
          gh run download 42659656721 --repo "$GITHUB_REPOSITORY" \
            -n hbeauty-v18-reproducible-gfpgan-weights -D /tmp/recovery/gfpgan
          gh run download 42660193869 --repo "$GITHUB_REPOSITORY" \
            -n hbeauty-v18-reproducible-browser-runtime -D /tmp/recovery/runtime
          gh run download 42660622147 --repo "$GITHUB_REPOSITORY" \
            -n hbeauty-v18-mp-comparison-not-verified -D /tmp/recovery/face
      - name: Assemble only fully verified files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('/tmp/v18-recovered/public')
          checks={
            'tryon/face-hd/gfpgan-1.4-q8.0.bin':'f2a0ecfb6b8c87e63ed45fa74802ed5588fcab4b3a47f1bba174287f6df079b9',
            'tryon/face-hd/gfpgan-1.4-q8.1.bin':'96fd074aa10814f557e51fee070924d433f5b08035d87f6438d5f3709cc13092',
            'tryon/ort/ort-wasm-simd-threaded.asyncify.mjs':'3d1c85995364bb643302fc6fd877a0c3ba5ae72401815e0f24828a53d9191e28',
            'tryon/ort/ort-wasm-simd-threaded.asyncify.wasm':'39f9f0894d478800487ed9f7dbe92618498db320cf55c8e3d89adff8dce658da',
            'tryon/ort/ort-wasm-simd-threaded.mjs':'e13f7f94fc51b4ca72b12faeb1ee95f4ace6dfbc8939bc718aabdc0a27c4299b',
            'tryon/ort/ort-wasm-simd-threaded.wasm':'3398c10d07d229bd91b364548e130e0e51a8e5704b88c7c083ebbeb78842dee2',
            'tryon/wasm/vision_wasm_internal.js':'6522286aa32dd93eff17c3da002b0649516f87abfec7a80b5bfe5c9625caa5f8',
            'tryon/wasm/vision_wasm_internal.wasm':'0e101a010e262ef8e78f22e3c95b60a9705fd06962753c9acd6356d9fb56b7bd',
            'tryon/face_landmarker.task':'64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff',
          }
          groups=[
            Path('/tmp/recovery/gfpgan'),
            Path('/tmp/recovery/runtime'),
            Path('/tmp/recovery/face')
          ]
          report={}
          for rel,expected in checks.items():
            matches=[p for base in groups for p in base.rglob(Path(rel).name) if p.is_file()]
            matches=[p for p in matches if hashlib.file_digest(p.open('rb'),'sha256').hexdigest()==expected]
            assert len(matches)==1, f'Missing/ambiguous verified V18 source for {rel}: {len(matches)} matches'
            destination=root/rel
            destination.parent.mkdir(parents=True,exist_ok=True)
            shutil.copyfile(matches[0],destination)
            assert hashlib.file_digest(destination.open('rb'),'sha256').hexdigest()==expected
            report['/'+rel]={'bytes':destination.stat().st_size,'sha256':expected}
          (root.parent/'RECOVERY_MANIFEST.json').write_text(json.dumps({'release':'V18','verified_source':'pinned upstream','files':report},indent=2))
          print('PASS merged',len(report),'model/runtimes,',sum(x['bytes'] for x in report.values()),'exact source bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hbeauty-v18-recovered-offline-models-VERIFIED
          path: /tmp/v18-recovered/
          retention-days: 60
      - name: Limits
        if: always()
        run: |
          echo 'Only 9 SHA256-matched files. Missing V18 catalog-specific look models and segmentation remain outside this artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not label this a complete offline model pack. This does not publish the salon or staging site.' >> "$GITHUB_STEP_SUMMARY"
