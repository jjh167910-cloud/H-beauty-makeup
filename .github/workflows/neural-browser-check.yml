name: End-to-end hosted neural generation smoke
on:
  push:
    paths:
      - '.github/workflows/neural-browser-check.yml'
      - '.github/staging/neural-browser-check.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser_neural:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install "pillow>=10,<13"
      - run: npx playwright install --with-deps chromium
      - name: Build schematic source and makeup-reference fixtures
        shell: bash
        run: |
          mkdir -p /tmp/hbeauty-neural-fixtures
          python - <<'PY'
          from PIL import Image,ImageDraw
          for style,name in [(False,'source'),(True,'reference')]:
              im=Image.new('RGB',(320,400),'#F5F3EF');d=ImageDraw.Draw(im)
              d.ellipse((36,12,285,387),fill='#47352e')
              d.ellipse((60,37,260,359),fill='#bd8b70')
              d.arc((76,140,153,182),180,355,fill='#332724',width=8)
              d.arc((172,140,249,182),180,355,fill='#332724',width=8)
              d.ellipse((113,158,124,163),fill='#251d1d')
              d.ellipse((207,158,218,163),fill='#251d1d')
              d.line((164,163,149,248,173,253),fill='#885d4c',width=7)
              d.ellipse((117,284,207,301),fill='#9f4556' if style else '#91675e')
              if style:
                  d.arc((76,137,153,184),180,350,fill='#29202a',width=15)
                  d.arc((172,137,249,184),180,350,fill='#29202a',width=15)
                  d.ellipse((70,246,112,275),fill='#be7b7b')
              im.save('/tmp/hbeauty-neural-fixtures/'+name+'.png')
          PY
      - name: Trigger real model through browser client and verify generated output
        run: node .github/staging/neural-browser-check.mjs
      - if: always()
        run: echo 'Synthetic schematic inputs only. A successful image does not certify face identity, makeup fidelity or photographic realism.' >> "$GITHUB_STEP_SUMMARY"
