name: Capture isolated makeup preview screenshots
on:
  push:
    paths:
      - '.github/workflows/browser-capture.yml'
      - 'scripts/ci-browser-capture.mjs'
      - 'QUALITY_V14_MANIFEST.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Launch browser preview locally
        shell: bash
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/hbeauty-preview.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hbeauty-preview.log
          exit 1
      - name: Capture homepage and makeup catalog at real browser viewport sizes
        run: node scripts/ci-browser-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-beauty-makeup-visual-smoke
          path: quality-reports/browser-preview/
          retention-days: 7
      - name: Scope and model disclaimer
        if: always()
        run: |
          echo "Screenshots are from the imported baseline unless V14 import completed." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow never deploys to production or asserts neural photorealism." >> "$GITHUB_STEP_SUMMARY"
